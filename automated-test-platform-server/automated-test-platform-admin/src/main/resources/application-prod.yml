# 只覆盖与默认配置不同的部分
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:self-delta-test}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      host: redis-svc.deltatest-prod
      password: ${REDIS_PASSWORD}
  rabbitmq:
    host: rabbitmq-svc.deltatest-prod
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /deltatest
grpc:
  client:
    engine:
      host: engine-svc.deltatest-prod
      use-tls: true
      trust-cert-path: ${GRPC_TRUST_CERT_PATH:}
ai:
  service:
    url: http://ai-svc.deltatest-prod:8000
jwt:
  secret: ${JWT_SECRET} # 强制从环境变量读取
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
logging:
  level:
    root: WARN
    com.dwl: INFO